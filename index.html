<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Woy Cut, Baca Ini! ✨</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Caveat:wght@700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>
<body>

<!-- LOADING SCREEN -->

<div class="loader" id="loader">

    <div class="moon">
        🌙
    </div>

    <h2>
        Packages memories...✈️...
    </h2>


    <div class="loading-bar">

        <div class="loading-progress"></div>

    </div>


    <p class="tap-text" id="tapText">
        Start your journey ✨
    </p>


</div>

<!-- =========================
     Background
========================= -->

<div class="stars"></div>

<div id="hearts-container"></div>

<div id="sparkles"></div>

<!-- =========================
     Main Container
========================= -->

<div class="container">

    <!-- Judul -->

    <div class="title">

        <h1>Our Little Story 🌙</h1>

        <p>Every picture has a memory.</p>

    </div>

    <!-- Gallery -->

    <div class="gallery">

        <img src="image/photo3.jpg" alt="Photo 1">

        <img src="image/photo4.jpg" alt="Photo 2">

        <img src="image/photo5.jpg" alt="Photo 3">

        <img src="image/photo6.jpg" alt="Photo 4">

        <img src="image/photo7.webp" alt="Photo 5">

    </div>

    <!-- Envelope -->

    <div class="envelope-area">

        <p class="click-text">
            Click the envelope 💌
        </p>

        <div class="envelope" id="envelope">

            <div class="lid"></div>

            <div class="paper"></div>

            <div class="heart">
                ❤
            </div>

        </div>

    </div>

    <!-- Letter -->

    <section class="letter" id="letter">

        <h2>HALOW ENCUTT 🌸</h2>

        <div class="letter-body">

            <p id="typing"></p>

        </div>

    </section>
    <!-- AIRPLANE -->

<div class="plane-container" id="planeContainer">

    <div class="plane">
        ✈️
    </div>

    <p>
        Tap the plane ✈️
    </p>

</div>
<!-- CLOUD EFFECT -->

<div class="cloud-container" id="cloudContainer">

    <div class="cloud cloud-a"></div>

    <div class="cloud cloud-b"></div>

    <div class="cloud cloud-c"></div>

</div>

<div class="sky-blur" id="skyBlur"></div>


<!-- END PAGE -->

<div class="ending" id="ending">

    <div class="route">

        <span>
            Jakarta
        </span>

        <span class="flight">
            ✈
        </span>

        <span>
            Aceh
        </span>

    </div>


    <h2>
        From,
    </h2>

    <h1>
        Aqiis imuup🤍
    </h1>


</div>

    <button id="replayBtn">
        ↻ Replay The Journey?
    </button>

</div>

</div>

<!-- Music -->

<audio id="music" loop preload="auto">

    <source src="./music.mp3" type="audio/mpeg">

</audio>

<script src="script.js"></script>

</body>

</html>
